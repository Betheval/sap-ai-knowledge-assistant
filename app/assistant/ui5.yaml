specVersion: '4.0'
metadata:
  name: knowledge.assistant
type: application
framework:
  name: SAPUI5
  version: '1.148.13'
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.ui.layout
    - name: themelib_sap_horizon
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
builder:
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
customConfiguration:
  cds-plugin-ui5:
    mountPath: /assistant
